<!DOCTYPE html>
<html>
    <title>
        button colours
    </title>
    <style>
   
        .nav button{
background-color: rgba(200, 0, 0, 0.871);
color: white;
border: none;
height: 60px;
width: 150px;
border-radius:5PX;
cursor:pointer;

        }
        .na button{
background-color: white;
font-size: large;
color: skyblue;
border-color: black;
height: 40px;
width: 100px;
font-style:bold;
border-radius: 4px;
cursor: pointer;

        }
             .nav, .na {
                
    display:inline-block;
             }
.na {
    margin-left: 20px; /* gap between buttons */
}
.tweet{margin-left: 30px;}
.tweet{
    background-color: rgb(8, 176, 242);
    color: white;
    border: none;
    font-size: medium;
    font-weight: bold;
    height:38px;
    width: 90px;
    border-radius:30px;
    cursor: pointer;

}
    </style>
    <body>
        <DIV CLASS="nav">
        <button>SUBSCRIBE</button>
        </DIV>
         <DIV CLASS="na">
        <button>JOIN</button>
        </DIV>
        <button class="tweet">Tweet</button>
<div>
    <br>
    <br>
    <img src="buttons.png" title="button style exercise image">
</div>
    </body>
</html>
