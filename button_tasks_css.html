<!DOCTYPE html>
<html>
<head>
    <title>buttons and paragraphs</title>
    
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .nav {
            background-color: white;
            padding: 15px; /* creates outer white border */
        }

        .na {
            background-color: black;
            color: white;
            font-weight: bold;
            height: 50px;
            width: 150px;
            border: none;
            cursor: pointer;
        }

        .na:hover {
            opacity: 0.8; /* apply effect only on hover */
        }
    </style>
</head>

<body>
    <div class="nav">
        <button class="na">Request now</button>
    </div>
</body>
</html>
